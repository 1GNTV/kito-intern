name: Build unsigned iOS IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
jobs:
  ios:
    runs-on: macos-26
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Test production cadence sampler
        run: |
          swiftc ArchiveCam/Engine/CadenceSampler.swift tests/CadenceChecks.swift -o /tmp/archivecam-cadence-tests
          /tmp/archivecam-cadence-tests
      - name: Verify the recorded microphone signal
        run: |
          swiftc ArchiveCam/Models/{CameraProfile,ImagingRecipe}.swift ArchiveCam/Engine/{CameraMicrophone,VideoRecorder}.swift tests/AudioChecks.swift -o /tmp/archivecam-audio-tests
          /tmp/archivecam-audio-tests
      - name: Compile and exercise production Metal image pipeline
        run: |
          xcrun -sdk macosx metal -c ArchiveCam/Engine/LegacyCamera.metal -o /tmp/archivecam-test.air
          xcrun -sdk macosx metallib /tmp/archivecam-test.air -o /tmp/archivecam-test.metallib
          swiftc ArchiveCam/Models/CameraProfile.swift ArchiveCam/Models/ImagingRecipe.swift tests/RenderChecks.swift -o /tmp/archivecam-render-tests
          /tmp/archivecam-render-tests
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for physical iPhone without code-signing
        run: |
          set -o pipefail
          xcodebuild -project ArchiveCam.xcodeproj \
            -scheme ArchiveCam \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build | tee xcodebuild.log
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          test -d "DerivedData/Build/Products/Release-iphoneos/ArchiveCam.app"
          mkdir -p Payload
          cp -R "DerivedData/Build/Products/Release-iphoneos/ArchiveCam.app" Payload/
          zip -qry ArchiveCam-unsigned.ipa Payload
          unzip -t ArchiveCam-unsigned.ipa
          test -s Payload/ArchiveCam.app/default.metallib
          test -x Payload/ArchiveCam.app/ArchiveCam
          file Payload/ArchiveCam.app/ArchiveCam | grep -q arm64
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' Payload/ArchiveCam.app/Info.plist
          shasum -a 256 ArchiveCam-unsigned.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ArchiveCam-unsigned-IPA
          path: ArchiveCam-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ArchiveCam-build-log
          path: xcodebuild.log
          if-no-files-found: ignore
  finder:
    runs-on: macos-26
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Launch the camera interface on iPhone Simulator
        run: |
          set -euo pipefail
          phone=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for runtime, devices in sorted(json.load(sys.stdin)["devices"].items(), reverse=True) if ".iOS-" in runtime for d in devices if d["name"].startswith("iPhone") and d["isAvailable"]))')
          xcrun simctl boot "$phone"
          brew install xcodegen
          xcodegen generate
          xcodebuild -quiet -scheme ArchiveCam -configuration Debug -destination "id=$phone" -derivedDataPath sim-build CODE_SIGNING_ALLOWED=NO build
          xcrun simctl bootstatus "$phone" -b
          app=com.projectkito.archivecam
          xcrun simctl install "$phone" sim-build/Build/Products/Debug-iphonesimulator/ArchiveCam.app
          xcrun simctl privacy "$phone" grant camera "$app"
          xcrun simctl privacy "$phone" grant microphone "$app"
          xcrun simctl launch "$phone" "$app"
          sleep 4
          xcrun simctl io "$phone" screenshot finder.png
      - uses: actions/upload-artifact@v4
        with:
          name: ArchiveCam-finder
          path: finder.png
          retention-days: 7
