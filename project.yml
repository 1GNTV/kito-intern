name: ArchiveCam
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.projectkito.archivecam
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    CODE_SIGN_STYLE: Automatic
targets:
  ArchiveCam:
    type: application
    platform: iOS
    sources:
      - path: ArchiveCam
    settings:
      base:
        INFOPLIST_FILE: ArchiveCam/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    dependencies: []
schemes:
  ArchiveCam:
    build:
      targets:
        ArchiveCam: all
    run:
      config: Debug
    archive:
      config: Release
